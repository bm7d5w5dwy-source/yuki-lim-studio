<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuki Lim Studio - Team System</title>
<style>
:root {
  --bg: #FAF6EF;
  --ink: #2A2119;
  --ink-soft: #8B7D6E;
  --card: #FFFFFF;
  --border: #E7DDCC;
  --rose: #7D2E3E;
  --amber: #B8763A;
  --amber-soft: #F5E7D6;
  --sidebar-bg: #241B22;
  --sidebar-text: #EDE3DC;
}

* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); margin: 0; padding: 0; }

.login-page { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--sidebar-bg) 0%, #3A2E38 100%); min-height: 100vh; }
.login-box { background: var(--card); border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
.login-box h1 { font-size: 28px; margin: 0 0 8px; text-align: center; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
.login-field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.pwd-field { position: relative; }
.pwd-field input { padding-right: 36px; }
.pwd-toggle { cursor: pointer; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-soft); font-size: 16px; }
.login-btn { width: 100%; padding: 11px; background: var(--rose); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.login-error { color: #c41e3a; font-size: 12px; margin-top: 8px; text-align: center; }

.main-container { display: flex; width: 100%; min-height: 100vh; }
.sidebar { width: 220px; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 26px 18px; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.brand h2 { font-size: 18px; margin: 0 0 4px; }
.brand p { font-size: 12px; color: #B5A99C; margin: 0; }
.nav { display: flex; flex-direction: column; gap: 3px; flex: 1; margin-top: 32px; }
.nav button { cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #D8CCC0; background: none; border: none; }
.nav button.active { background: var(--rose); color: white; }
.logout-btn { cursor: pointer; padding: 10px 12px; border-radius: 8px; font-size: 12px; background: #3A2E38; border: none; color: #D8CCC0; text-align: center; margin-top: auto; }

.main-content { flex: 1; padding: 30px 34px; overflow-y: auto; }
.header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; }
.header h1 { font-size: 32px; margin: 0; }

.payment-reminder { background: var(--amber-soft); border-left: 4px solid var(--amber); padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.stat .label { font-size: 12px; color: var(--ink-soft); }
.stat .val { font-size: 24px; margin-top: 6px; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; }
.card h3 { font-size: 16px; margin: 0 0 10px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F1EBE2; font-size: 14px; }
.row:last-child { border-bottom: none; }

.btn { cursor: pointer; background: var(--rose); color: white; padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; }
.btn:hover { background: #6b2530; }

.modal-bg { position: fixed; inset: 0; background: rgba(36,27,34,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: var(--card); border-radius: 12px; padding: 24px; width: 500px; max-height: 85vh; overflow-y: auto; }
.modal h3 { margin: 0 0 16px; font-size: 18px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
.field input, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: inherit; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const PASSWORDS = {
  shiqi: 'Welcome123',
  jiawen: 'Welcome123',
  amanda: 'Welcome123',
  admin: 'Welcome123'
};

const USERS = {
  shiqi: { name: 'Shiqi', role: 'assistant' },
  jiawen: { name: 'Jiawen', role: 'assistant' },
  amanda: { name: 'Amanda', role: 'assistant' },
  admin: { name: 'Admin', role: 'admin' }
};

let currentUser = null;
let currentMonth = new Date().toISOString().slice(0, 7);

function getData(key) {
  try {
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function setData(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function handleLogin() {
  const username = document.getElementById('username').value.toLowerCase();
  const password = document.getElementById('password').value;
  
  if (!PASSWORDS[username] || PASSWORDS[username] !== password) {
    document.getElementById('errorMsg').textContent = 'Invalid username or password';
    return;
  }
  
  currentUser = { username, ...USERS[username] };
  render();
}

function handleLogout() {
  currentUser = null;
  render();
}

function togglePassword() {
  const pwd = document.getElementById('password');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
}

function getCurrentMonthData(username) {
  const allData = getData('yuki_work_data');
  const userData = allData[username] || [];
  return userData.filter(row => row.Date && row.Date.slice(0, 7) === currentMonth);
}

function calculateShiqiCommission() {
  const work = getCurrentMonthData('shiqi');
  let gross = 0, commission = 0;
  work.forEach(row => {
    const price = parseFloat(row['Price (SGD)']) || 0;
    const morning = (parseFloat(row['Morning Surcharge (hrs)']) || 0) * 50;
    const transport = parseFloat(row['Transport (SGD)']) || 0;
    gross += price + morning + transport;
    if ((row['Work Type'] || '').toLowerCase().includes('makeup')) commission += price * 0.25;
  });
  const bonus = gross > 3000 ? 50 : 0;
  return { gross: Math.round(gross), commission: Math.round(commission), bonus, total: Math.round(gross - commission + bonus) };
}

function calculateAssistantEarnings(username) {
  const work = getCurrentMonthData(username);
  let total = 0;
  work.forEach(row => {
    const price = parseFloat(row['Price (SGD)']) || 0;
    const morning = (parseFloat(row['Morning Surcharge (hrs)']) || 0) * 50;
    const transport = parseFloat(row['Transport (SGD)']) || 0;
    total += price + morning + transport;
  });
  return Math.round(total);
}

function openAddWorkModal() {
  const html = `
    <div class="modal-bg" id="workModal" onclick="if(event.target.id==='workModal') closeAddWorkModal()">
      <div class="modal">
        <h3>Add Work</h3>
        <div class="field">
          <label>Date</label>
          <input type="date" id="workDate" value="${new Date().toISOString().split('T')[0]}">
        </div>
        <div class="field">
          <label>Work Type</label>
          <input type="text" id="workType" placeholder="e.g. Bridal makeup">
        </div>
        <div class="field">
          <label>Price (SGD)</label>
          <input type="number" id="workPrice" placeholder="0" step="0.01">
        </div>
        <div class="field">
          <label>Morning Surcharge (hours)</label>
          <input type="number" id="workMorning" placeholder="0" step="0.5">
        </div>
        <div class="field">
          <label>Transport (SGD)</label>
          <input type="number" id="workTransport" placeholder="0" step="0.01">
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="workNotes" placeholder="Optional" style="resize: none; height: 60px;"></textarea>
        </div>
        <div class="modal-actions">
          <button onclick="closeAddWorkModal()" class="btn" style="background: transparent; color: var(--ink); border: 1px solid var(--border);">Cancel</button>
          <button onclick="saveWork()" class="btn">Save</button>
        </div>
      </div>
    </div>
  `;
  
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div);
}

function closeAddWorkModal() {
  const modal = document.getElementById('workModal');
  if (modal) modal.remove();
}

function saveWork() {
  const date = document.getElementById('workDate').value;
  const type = document.getElementById('workType').value;
  const price = parseFloat(document.getElementById('workPrice').value) || 0;
  const morning = parseFloat(document.getElementById('workMorning').value) || 0;
  const transport = parseFloat(document.getElementById('workTransport').value) || 0;
  const notes = document.getElementById('workNotes').value;
  
  if (!date || !type) {
    alert('Please fill in Date and Work Type');
    return;
  }
  
  const allData = getData('yuki_work_data');
  if (!allData[currentUser.username]) allData[currentUser.username] = [];
  
  allData[currentUser.username].push({
    Date: date,
    'Work Type': type,
    'Price (SGD)': price,
    'Morning Surcharge (hrs)': morning,
    'Transport (SGD)': transport,
    Notes: notes
  });
  
  setData('yuki_work_data', allData);
  closeAddWorkModal();
  render();
}

function renderLoginPage() {
  return `
    <div class="login-page">
      <div class="login-box">
        <h1>Yuki Lim Studio</h1>
        <p style="text-align: center; color: var(--ink-soft); margin-bottom: 32px;">Team Management System</p>
        <div class="login-field">
          <label>Username</label>
          <input type="text" id="username" placeholder="shiqi, jiawen, amanda, admin">
        </div>
        <div class="login-field">
          <label>Password</label>
          <div class="pwd-field">
            <input type="password" id="password" placeholder="Welcome123">
            <button type="button" class="pwd-toggle" onclick="togglePassword()">◉</button>
          </div>
        </div>
        <button class="login-btn" onclick="handleLogin()">Sign In</button>
        <div id="errorMsg" class="login-error"></div>
      </div>
    </div>
  `;
}

function renderAdminDashboard() {
  const shiqiCalc = calculateShiqiCommission();
  const jiaWenEarn = calculateAssistantEarnings('jiawen');
  const amandaEarn = calculateAssistantEarnings('amanda');
  const yourEarn = calculateAssistantEarnings('admin');
  const totalToPay = shiqiCalc.total + jiaWenEarn + amandaEarn;
  
  return `
    <div class="payment-reminder"><strong>💰 Payment Date:</strong> Pay all staff on the 1st of each month</div>
    <div class="header">
      <div>
        <h1>Team Dashboard</h1>
        <p style="color: var(--ink-soft); margin: 4px 0 0;">Overview for ${currentMonth}</p>
      </div>
      <button onclick="openAddWorkModal()" class="btn">+ Add Work</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">Total To Pay</div><div class="val">S$${totalToPay}</div></div>
      <div class="stat"><div class="label">My Earnings</div><div class="val">S$${yourEarn}</div></div>
      <div class="stat"><div class="label">My Commission</div><div class="val">S$${shiqiCalc.commission}</div></div>
      <div class="stat"><div class="label">Team Members</div><div class="val">3</div></div>
    </div>
    <div class="card">
      <h3>Team Summary (${currentMonth})</h3>
      <div class="row"><div><strong>Shiqi</strong></div><div>To Pay: S$${shiqiCalc.total}</div></div>
      <div class="row"><div><strong>Jiawen</strong></div><div>To Pay: S$${jiaWenEarn}</div></div>
      <div class="row"><div><strong>Amanda</strong></div><div>To Pay: S$${amandaEarn}</div></div>
      <div class="row"><div><strong>Your Work</strong></div><div>Earned: S$${yourEarn}</div></div>
    </div>
  `;
}

function renderTeamMemberDashboard() {
  const calc = calculateAssistantEarnings(currentUser.username);
  const workList = getCurrentMonthData(currentUser.username);
  
  return `
    <div class="payment-reminder"><strong>💰 Payment Date:</strong> 1st of each month</div>
    <div class="header">
      <div>
        <h1>My Dashboard</h1>
        <p style="color: var(--ink-soft); margin: 4px 0 0;">Earnings for ${currentMonth}</p>
      </div>
      <button onclick="openAddWorkModal()" class="btn">+ Add Work</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="label">This Month Earned</div><div class="val">S$${calc}</div></div>
      <div class="stat"><div class="label">Projects</div><div class="val">${workList.length}</div></div>
    </div>
    <div class="card">
      <h3>Work Records (${currentMonth})</h3>
      ${workList.length ? workList.map(w => `
        <div class="row">
          <div><strong>${w['Work Type']}</strong><div style="font-size: 12px; color: var(--ink-soft); margin-top: 2px;">${w.Date}</div></div>
          <div>S$${w['Price (SGD)']}</div>
        </div>
      `).join('') : '<div style="color: var(--ink-soft); text-align: center; padding: 20px;">No work records this month</div>'}
    </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  
  if (!currentUser) {
    app.innerHTML = renderLoginPage();
    return;
  }
  
  let content = currentUser.role === 'admin' ? renderAdminDashboard() : renderTeamMemberDashboard();
  
  app.innerHTML = `
    <div class="main-container">
      <div class="sidebar">
        <div class="brand">
          <h2>Yuki Lim Studio</h2>
          <p>Team System</p>
        </div>
        <div class="nav">
          <button class="nav-btn active">Dashboard</button>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
      </div>
      <div class="main-content">${content}</div>
    </div>
  `;
}

render();
</script>

</body>
</html>
